# Banchy OS — default user settings (system defaults).
# User overrides live in ~/.config/banchy/settings.conf
# Change values with: banchy set <key> <value>
theme=midnight
mode=dark
accent=
transparency=0.05
blur=on
border_size=2
border_radius=12
gaps_in=5
gaps_out=10
animations=on
anim_speed=1.0
font=JetBrains Mono
font_size=11
terminal_font=JetBrains Mono
cursor_size=24
waybar_position=top
waybar_height=36
wallpaper=
night_location=0,0
