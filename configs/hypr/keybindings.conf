# Banchy OS — keybindings (single source of truth; see: banchy keys)
# A comment line directly above a binding is shown by 'banchy keys'.

# Open terminal
bind = SUPER, RETURN, exec, kitty

# Application launcher
bind = SUPER, SPACE, exec, fuzzel

# File manager
bind = SUPER, E, exec, thunar

# Web browser
bind = SUPER, B, exec, chromium

# Code editor
bind = SUPER, C, exec, code

# Notes
bind = SUPER, O, exec, obsidian

# Close active window
bind = SUPER, Q, killactive,

# Power menu (logout, suspend, reboot, shutdown)
bind = SUPER SHIFT, X, exec, banchy-powermenu

# Control center (network, bluetooth, audio, display)
bind = SUPER, N, exec, banchy-cc

# Banchy Settings
bind = SUPER, P, exec, banchy-settings

# Show keybindings
bind = SUPER, K, exec, kitty -e banchy keys

# Screenshot region (copied to clipboard)
bind = SUPER SHIFT, S, exec, banchy-shot region

# Screenshot fullscreen
bind = SUPER ALT, S, exec, banchy-shot screen

# Toggle screen recording
bind = SUPER ALT, R, exec, banchy-shot video

# Clipboard history
bind = SUPER, V, exec, banchy-clip pick

# Reload Hyprland
bind = SUPER CTRL, R, exec, hyprctl reload

# Lock screen
bind = SUPER, L, exec, hyprlock

# Toggle floating
bind = SUPER, T, togglefloating,

# Fullscreen
bind = SUPER, F, fullscreen,

# Exit Hyprland
bind = SUPER SHIFT, E, exit,

# Move focus
bind = SUPER, LEFT, movefocus, l
bind = SUPER, DOWN, movefocus, d
bind = SUPER, UP, movefocus, u
bind = SUPER, RIGHT, movefocus, r

# Swap windows
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, DOWN, movewindow, d
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, RIGHT, movewindow, r

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Mouse bindings
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Media and brightness (laptops)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
