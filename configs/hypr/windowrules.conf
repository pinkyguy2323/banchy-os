# Banchy OS — window rules

# Utility windows float by default
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, class:^(imv)$

# Keep utility windows reasonably sized
windowrule = size 600 500, class:^(pavucontrol)$
windowrule = size 500 420, class:^(blueman-manager)$

# Pin utility windows to the center
windowrule = center, class:^(pavucontrol)$
windowrule = center, class:^(blueman-manager)$
windowrule = center, class:^(nm-connection-editor)$

# Suppress unwanted maximize requests (apps often request it on start)
windowrule = suppressevent maximize, class:.*
windowrule = suppressevent fullscreen, class:.*

# Idle behaviour: never let windows force DPMS back on
windowrule = idleinhibit focus, class:^(mpv)$
