# Banchy OS — Hyprland base configuration (static).
# Engine-managed values (colors, gaps, blur, animations) live in
# ~/.config/banchy/generated/hypr-dynamic.conf — change them with:
#   banchy set <key> <value>

source = ~/.config/banchy/generated/hypr-dynamic.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf

# --- session bootstrap -------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = banchy autostart

env = QT_QPA_PLATFORMTHEME,gtk3
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# --- input -------------------------------------------------------------------
input {
    kb_layout = us
    kb_options =
    follow_mouse = 1
    repeat_rate = 40
    repeat_delay = 250
    sensitivity = 0
    accel_profile =

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- layout ------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 0
}

master {
    new_status = master
}

# --- misc --------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    focus_on_activate = true
}
