LABEL banchy
TEXT HELP
Boot the Banchy OS live medium on BIOS.
The desktop starts with a quiet boot.
ENDTEXT
MENU LABEL Banchy OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% console=tty0 console=ttyS0,115200n8 quiet

LABEL banchy-verbose
TEXT HELP
Boot the Banchy OS live medium on BIOS with boot messages visible.
ENDTEXT
MENU LABEL Banchy OS (verbose)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% console=tty0 console=ttyS0,115200n8
