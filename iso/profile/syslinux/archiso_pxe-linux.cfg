LABEL banchy_nbd
TEXT HELP
Boot the Banchy OS live medium using NBD.
ENDTEXT
MENU LABEL Banchy OS (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} console=tty0 console=ttyS0,115200n8 %KERNEL_PARAMS%
SYSAPPEND 3

LABEL banchy_nfs
TEXT HELP
