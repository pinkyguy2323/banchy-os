APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt console=tty0 console=ttyS0,115200n8 %KERNEL_PARAMS%
SYSAPPEND 3

LABEL banchy_http
