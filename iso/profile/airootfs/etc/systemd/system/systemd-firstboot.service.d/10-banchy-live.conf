[Unit]
# Live image only: firstboot's interactive prompts (timezone/root password)
# hang the serial console before getty autologin can start, which stalls the
# CI smoke test. The live credentials are set by banchy-live-setup.service
# and the timezone ships in the overlay as /etc/localtime. Installed systems
# never see this drop-in (it lives in the iso profile's airootfs only).
ConditionFirstBoot=no
